name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build binaries (ARM32, ARM64, x86)
        run: |
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o gollery-arm32 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o gollery-arm64 .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o gollery-x86 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gollery-binaries
          path: |
            gollery-arm32
            gollery-arm64
            gollery-x86

      - name: Create Release and Upload Binaries
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Release v{0}', github.run_number) }}
          generate_release_notes: true
          files: |
            gollery-arm32
            gollery-arm64
            gollery-x86
